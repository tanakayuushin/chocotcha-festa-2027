<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>案A・案B 比較</title>
<meta name="description" content="やまぐちチョコっちゃ‼フェスタ 2027 公式サイトの改修案を、ページごとに並べて比較する確認用ページ。">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--ink:#4a1c0f;--choco:#5a2a17;--red:#e3171a;--cream:#fff4e6;--paper:#fffdf9;--line:#efd6bd;--muted:#70584e;--bg:#f3eae0}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-weight:500;min-height:100vh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.bar h1{font-size:16px;font-weight:900;color:var(--choco);margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.seg button{font:inherit;font-weight:900;font-size:13.5px;padding:7px 12px;border-radius:999px;border:2px solid var(--choco);background:#fff;color:var(--choco);cursor:pointer;min-height:36px}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.seg{display:flex;gap:6px;margin-left:auto}
.wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;align-items:start}
.pane{background:#fff;border:2px solid var(--choco);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pane header{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:2px solid var(--line);background:var(--cream)}
.pane header b{font-size:15px;font-weight:900;color:var(--choco)}
.pane header span{font-size:12.5px;color:var(--muted)}
.pane header a{margin-left:auto;font-size:12.5px;font-weight:900;color:var(--red)}
.frame{background:#e8dccd;display:flex;justify-content:center;padding:0}
iframe{border:0;background:#fff;width:100%;height:calc(100vh - 150px);display:block}
.wrap[data-w="390"] iframe{width:390px;box-shadow:0 0 0 1px var(--line)}
.wrap[data-w="390"] .frame{padding:12px 0}
.diff{grid-column:1 / -1;background:#fff;border:2px solid var(--choco);border-radius:14px;padding:16px 18px}
.diff h2{font-size:15px;font-weight:900;color:var(--choco);margin-bottom:8px}
.diff ul{padding-left:1.2em;font-size:14px}
.diff li{margin:4px 0}
.diff li b{color:var(--red)}
.diff p{font-size:13.5px;color:var(--muted);margin-top:8px}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  iframe{height:70vh}
  .seg{margin-left:0}
}
</style>
</head>
<body>
<div class="bar">
  <h1>案A・案B 比較</h1>
  <div class="tabs" id="tabs" role="group" aria-label="ページを選ぶ"></div>
  <div class="seg" role="group" aria-label="表示幅">
    <button type="button" data-w="pc" aria-pressed="true">PC幅</button>
    <button type="button" data-w="390" aria-pressed="false">スマホ幅</button>
  </div>
</div>
<div class="wrap" id="wrap" data-w="pc">
  <section class="pane" aria-labelledby="la">
    <header><b id="la">案A</b><span>今の案（修正案＋独自の調整）</span><a id="oa" href="index.html" target="_blank" rel="noopener">別タブで開く ↗</a></header>
    <div class="frame"><iframe id="fa" title="案A" src="index.html"></iframe></div>
  </section>
  <section class="pane" aria-labelledby="lb">
    <header><b id="lb">案B</b><span>修正案どおり（H01〜H24・D01〜D12）</span><a id="ob" href="proposal-r3/index.html" target="_blank" rel="noopener">別タブで開く ↗</a></header>
    <div class="frame"><iframe id="fb" title="案B" src="proposal-r3/index.html"></iframe></div>
  </section>
  <section class="diff" aria-live="polite">
    <h2 id="dh">このページでの主な違い</h2>
    <ul id="dl"></ul>
    <p>文面（開催予定、料金の案、申込みの流れ、主催・連絡先、個人情報の案内）は、どちらも修正案 r3 の掲載文案を使っています。違いは見せ方と、修正案に書かれていない部分の扱いです。</p>
  </section>
</div>
<script>
var PAGES=[
 ['index.html','トップ',[
  '<b>ロゴ</b>：Aはアイコン版を背景の上に置く。Bは参考案p13・D01のとおり、横長ロゴを白い面に入れる。',
  '<b>開催情報</b>：Aはチケット風のカード。Bは参考案p3「日時・会場・参加状態は単色の読みやすい面に置く」に従い、白い面に項目を並べる。',
  '<b>ボタンと装飾</b>：Aは丸いボタンと縁取り数字。Bは参考案p25の目安（角丸10〜14px、境界線1px、薄い影）に合わせる。装飾は紙・リボン・包装ストライプだけ。',
  '<b>構成</b>：Bは参考案p10のホーム構造「開催状態→ロゴと魅力→開催予定→主ボタン→4入口→概要→お知らせ→アクセス・主催」の順。Aは入口の後に概要を置く。',
  '<b>残した旧文</b>：Bは修正案に指示のない「十人十色のバレンタイン」の説明文と白狐の一文を旧サイトから残す。Aは書き直している。',
  '<b>お知らせ</b>：BはH21に従い「当日の変更・重要なお知らせ」の枠を通常のお知らせと分けて置く。'
 ]],
 ['enjoy.html','当日の楽しみ方',[
  '<b>タイトル</b>：Bは旧サイトの「当日の楽しみ方」と説明文を残す。Aは説明文を書き直している。',
  '<b>企画カード</b>：どちらもH03の4例。BはD04のとおり「名称→状態」の順をそろえ、代表1つを大きく。',
  '<b>休憩</b>：BはH11の「休憩場所も確定後にご案内します」を独立したカードで残す。Aは「来場の前に」にまとめる。',
  '<b>来場の前に</b>：Aにある「入場・会場・雨の日」のまとめは、修正案にないのでBでは置かない。'
 ]],
 ['timetable.html','タイムテーブル・ステージ',[
  '<b>ページ名</b>：Bは旧サイトの「タイムテーブル・ステージ」のまま。Aは「ステージ・出演」に変えている。',
  '<b>募集する出演の種類</b>：Bは旧サイトの一覧（バンド・ダンス・演劇など）を「募集予定」ラベルで残す。Aは一覧をなくし、例として一文にまとめている。',
  '<b>料金</b>：BはD07のとおりPCは比較表、スマホは区分ごとのブロック。Aは最初から区分ごとのカード。'
 ]],
 ['booth.html','ブース紹介',[
  '<b>ページ名</b>：Bは旧サイトの「ブース紹介」のまま。Aは「出店したい方へ」に変えている。',
  '<b>参加形態</b>：どちらもH07の5区分。Bは名称だけを並べ、補足はH07の文面を箇条書きで添える。Aは各区分に短い説明を加えている（修正案にない文）。',
  '<b>出店のかたち（H06）</b>：Bはトップに置く（修正案の指定場所はトップABOUT）。Aは出店ページの冒頭に置く。'
 ]],
 ['join.html','参加したい方へ',[
  '<b>ページ名</b>：Bは旧サイトの「参加したい方へ」のまま。Aは「参加の申込み・料金」。',
  '<b>POINT 4つ</b>：Bは旧サイトの4つのポイントを、H05・H06で変わった部分だけ書き換えて残す。Aは削除している。',
  '<b>料金</b>：BはPC比較表＋スマホ縦ブロック（D07）。Aは区分ごとのカード。',
  '<b>窓口・流れ・日程</b>：どちらもH09・H10・H21の文面で同じ。'
 ]],
 ['access.html','会場・アクセス',[
  '<b>並び</b>：BはD06のとおり「住所→交通→入口→地図」の順で、文字情報を先に置く。Aは地図を左、文字を右に置く。',
  '<b>雨の日</b>：BはH12の雨天案内を「会場の使い方」に残す（旧サイトにあった項目）。Aは雨の日の項目を短くしている。'
 ]],
 ['faq.html','よくある質問',[
  '<b>項目数</b>：Bは旧サイトの6問を、H04・H06・H12で変わった答えだけ書き換える。Aは申込み時期やアンケートなど5問を追加している（修正案にない）。',
  '<b>子どもの質問</b>：BはH04の文面だけで答える。Aは説明を補っている。'
 ]],
 ['contact.html','お問い合わせ',[
  '<b>ページ名</b>：Bは旧サイトの「お問い合わせ」のまま。Aは「お問い合わせ・協力」。',
  '<b>協力の種類</b>：BはH14の文面だけ。Aは協賛・物品・展示・運営の4つをアイコン付きで並べている。',
  '<b>個人情報</b>：どちらもH16の文面。Aは「保管期間などは決まり次第」の一文を加えている。'
 ]]
];
var tabs=document.getElementById('tabs'),fa=document.getElementById('fa'),fb=document.getElementById('fb'),oa=document.getElementById('oa'),ob=document.getElementById('ob'),dl=document.getElementById('dl'),dh=document.getElementById('dh'),wrap=document.getElementById('wrap');
function show(i){
  PAGES.forEach(function(p,j){tabs.children[j].setAttribute('aria-pressed',i===j?'true':'false')});
  var p=PAGES[i];fa.src=p[0];fb.src='proposal-r3/'+p[0];oa.href=p[0];ob.href='proposal-r3/'+p[0];
  dh.textContent='「'+p[1]+'」での主な違い';dl.innerHTML=p[2].map(function(t){return '<li>'+t+'</li>'}).join('');
  try{location.hash=p[0].replace('.html','')}catch(e){}
}
PAGES.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.textContent=p[1];b.setAttribute('aria-pressed','false');b.addEventListener('click',function(){show(i)});tabs.appendChild(b)});
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');wrap.dataset.w=b.dataset.w})});
var h=location.hash.replace('#',''),start=0;PAGES.forEach(function(p,i){if(p[0]===h+'.html')start=i});
show(start);
</script>
</body>
</html>
